{% extends 'base.html' %}
{% block content %}<section class="panel error-page"><p class="eyebrow">{{ t('error.request', status=error_status) }}</p><h1>{{ title }}</h1><p role="alert">{{ error }}</p>{% if error_detail %}<details><summary>{{ t('technical.details') }}</summary><p>{{ error_detail }}</p></details>{% endif %}<div class="form-actions"><a class="button primary" href="/">{{ t('error.back') }}</a><a class="button secondary" href="/generate">{{ t('generation.new') }}</a></div></section>{% endblock %}
